name: Update Hou Minghao feed and Weibo gallery

on:
  workflow_dispatch:

  schedule:
    # Every 4 hours. GitHub Actions cron uses UTC.
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: hou-minghao-daily-update
  cancel-in-progress: false

jobs:
  update-feed-and-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      # ======================================================
      # 1. CHECK OUT REPOSITORY
      # ======================================================

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. SET UP PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # 3. INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 deep-translator playwright
          python -m playwright install --with-deps chromium


      # ======================================================
      # 4. RUN MAIN FEED COLLECTOR
      # ======================================================

      - name: Run feed collector
        env:
          XHS_COOKIES_JSON: ${{ secrets.XHS_COOKIES_JSON }}
        run: |
          echo "Starting feed collector..."
          python update_feed.py


      # ======================================================
      # 5. RUN WEIBO GALLERY COLLECTOR
      # ======================================================

      - name: Build Weibo gallery
        run: |
          echo "Starting Weibo gallery collector..."
          python update_gallery.py


      # ======================================================
      # 6. SHOW GALLERY RESULTS
      # ======================================================

      - name: Show gallery output
        if: always()
        run: |
          echo "========================================"
          echo "Gallery media directory"
          echo "========================================"

          if [ -d "gallery_media" ]; then

            echo "gallery_media exists."

            echo ""
            echo "First 50 files:"
            find gallery_media -maxdepth 1 -type f -printf '%f\n' | head -50

            echo ""
            echo "Total gallery files:"
            find gallery_media -maxdepth 1 -type f | wc -l

          else

            echo "gallery_media does not exist."

          fi

          echo ""
          echo "========================================"
          echo "Gallery JSON information"
          echo "========================================"

          if [ -f "gallery.json" ]; then

            python -c "import json; d=json.load(open('gallery.json', encoding='utf-8')); print('Status:', d.get('status')); print('Total:', d.get('total')); print('Last updated:', d.get('lastUpdated'))"

          else

            echo "gallery.json does not exist."

          fi


      # ======================================================
      # 7. VALIDATE GENERATED JSON
      # ======================================================

      - name: Validate generated JSON files
        run: |
          echo "Validating posts.json..."
          python -m json.tool posts.json > /dev/null

          echo "Validating gallery.json..."
          python -m json.tool gallery.json > /dev/null

          echo "JSON validation passed."


      # ======================================================
      # 8. SHOW GENERATED CHANGES
      # ======================================================

      - name: Show generated changes
        run: |
          echo "========================================"
          echo "Git status before commit"
          echo "========================================"

          git status --short


      # ======================================================
      # 9. COMMIT AND PUSH GENERATED FILES
      # ======================================================

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            posts.json \
            gallery.json \
            media \
            gallery_media \
            2>/dev/null || git add -A

          echo "========================================"
          echo "Files staged for commit"
          echo "========================================"

          git diff --cached --name-status

          if git diff --cached --quiet; then

            echo "No feed or gallery changes detected."

          else

            git commit -m "Update Hou Minghao feed and Weibo gallery"

            echo "Checking for remote changes..."
            git pull --rebase origin main

            echo "Pushing generated updates..."
            git push origin main

          fi


      # ======================================================
      # 10. FINAL STATUS
      # ======================================================

      - name: Final status
        if: always()
        run: |
          echo "========================================"
          echo "Hou Minghao update workflow completed"
          echo "========================================"

          echo ""
          echo "Repository status:"
          git status --short || true

          echo ""
          echo "Gallery media file count:"

          if [ -d "gallery_media" ]; then
            find gallery_media -maxdepth 1 -type f ! -name ".gitkeep" | wc -l
          else
            echo "0"
          fi
