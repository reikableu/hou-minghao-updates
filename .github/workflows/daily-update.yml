name: Hou Minghao Feed Update

on:
  workflow_dispatch:

  schedule:
    # Runs every 4 hours at minute 38.
    # GitHub cron schedules use UTC by default.
    # Singapore schedule:
    # 12:38 AM, 4:38 AM, 8:38 AM, 12:38 PM,
    # 4:38 PM, and 8:38 PM.
    - cron: "38 */4 * * *"

permissions:
  contents: write

concurrency:
  group: hou-minghao-feed-update
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 deep-translator

      - name: Check Python syntax
        run: python -m py_compile update_feed.py

      - name: Run Hou Minghao feed collector
        run: python update_feed.py

      - name: Validate posts.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          posts_file = Path("posts.json")

          if not posts_file.exists():
              raise FileNotFoundError(
                  "posts.json was not generated."
              )

          data = json.loads(
              posts_file.read_text(encoding="utf-8")
          )

          if not isinstance(data, dict):
              raise ValueError(
                  "posts.json must contain a JSON object."
              )

          posts = data.get("posts")

          if not isinstance(posts, list):
              raise ValueError(
                  "posts.json must contain a posts list."
              )

          print("posts.json validated successfully.")
          print("Saved posts:", len(posts))
          print("Last updated:", data.get("lastUpdated"))
          print("Collector status:", data.get("status"))
          PY

      - name: Save updated feed and cached images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json

          if [ -d "media" ]; then
            git add -A media/
          fi

          if git diff --cached --quiet; then
            echo "No feed or image changes to save."
          else
            git commit -m "Update Hou Minghao feed and images"
            git push
          fi
