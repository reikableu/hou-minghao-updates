name: Update Hou Minghao feed and gallery

on:
  workflow_dispatch:
  schedule:
    # Every 4 hours. GitHub Actions cron uses UTC.
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: hou-minghao-daily-update
  cancel-in-progress: false

jobs:
  update-feed-and-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 deep-translator playwright
          playwright install --with-deps chromium

      - name: Run feed collector
        env:
          XHS_COOKIES_JSON: ${{ secrets.XHS_COOKIES_JSON }}
        run: python update_feed.py

      - name: Generate gallery from collected feed images
        run: python update_gallery.py

      - name: Validate generated JSON files
        run: |
          python -m json.tool posts.json > /dev/null
          python -m json.tool gallery.json > /dev/null

      - name: Commit generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json gallery.json media update_feed.py update_gallery.py
          if git diff --cached --quiet; then
            echo "No feed or gallery changes detected."
          else
            git commit -m "Update Hou Minghao feed and gallery"
            git pull --rebase origin main
            git push origin main
          fi
