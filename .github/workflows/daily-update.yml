name: Hou Minghao Daily Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 deep-translator

      - name: Check Python syntax
        run: python -m py_compile update_feed.py

      - name: Run Hou Minghao feed collector
        run: python update_feed.py

      - name: Save updated feed and cached images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posts.json

          if [ -d "media" ]; then
            git add media/
          fi

          if git diff --cached --quiet; then
            echo "No feed or image changes to save."
          else
            git commit -m "Daily Hou Minghao feed and image update"
            git push
          fi
