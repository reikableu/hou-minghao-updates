name: Update Feed

on:
  schedule:
    # Runs every 4 hours (at minute 0 past every 4th hour)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual triggers from GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 deep-translator

      - name: Run update script
        run: python update_feed.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update posts.json [skip ci]" && git push)
